services:
  cennomo:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - cennomo-data:/app/data
      - cennomo-streams:/app/streams
    expose:
      - "4185"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4185/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      cennomo:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cennomo-data:
  cennomo-streams:
  caddy-data:
  caddy-config:
