services:
  cennomo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      CENNOMO_LIVE_FRAME_INTERVAL_MS: 850
    volumes:
      - ./data:/app/data
      - ./streams:/app/streams
    expose:
      - "4185"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - cennomo
    environment:
      CENNOMO_HOST: ${CENNOMO_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
